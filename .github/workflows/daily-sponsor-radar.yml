name: Daily Sponsor Radar

on:
  schedule:
    - cron: "15 7 * * *"   # 07:15 UTC every day, after the Job Radar run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-sponsor-radar
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    env:
      SPONSOR_NTFY_TOPIC: ${{ secrets.SPONSOR_NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test sponsor-radar/scripts/test.mjs sponsor-radar/scripts/fetch.test.mjs sponsor-radar/scripts/design.test.mjs

      - name: Fetch jobs
        id: fetch
        env:
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: node sponsor-radar/scripts/fetch-jobs.mjs

      - name: Commit results
        run: |
          git config user.name "sponsor-radar"
          git config user.email "sponsor-radar@users.noreply.github.com"
          git add sponsor-radar/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Sponsor Radar feed"
            git pull --rebase origin main
            git push
          fi

      - name: Morning alert
        if: ${{ steps.fetch.outputs.new_count != '0' && env.SPONSOR_NTFY_TOPIC != '' }}
        env:
          NEW_COUNT: ${{ steps.fetch.outputs.new_count }}
        run: |
          curl -s -H "Title: Sponsor Radar" -H "Click: https://chigozie-nkwopara.netlify.app/sponsor-radar/" \
            -d "$NEW_COUNT new analyst roles in the feed today" "https://ntfy.sh/$SPONSOR_NTFY_TOPIC"
